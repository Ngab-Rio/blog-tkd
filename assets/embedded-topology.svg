<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Alur embedded system</title>
  <desc id="desc">Input membaca data, mikrokontroler memprosesnya, lalu output menjalankan aksi.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#ffd166"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#102a43"/>
  <text x="70" y="70" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">EMBEDDED SYSTEM</text>
  <text x="70" y="105" fill="#b9d6e8" font-family="Arial, sans-serif" font-size="18">Data masuk, diproses, lalu menghasilkan tindakan</text>
  <path d="M360 235H465M735 235H840" stroke="#ffd166" stroke-width="7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="70" y="155" width="290" height="160" rx="18" fill="#f7fbff"/>
    <circle cx="125" cy="210" r="27" fill="#1f8a70"/><path d="M125 194v32M109 210h32" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="170" y="210" fill="#102a43" font-family="Arial, sans-serif" font-size="25" font-weight="700">INPUT</text>
    <text x="100" y="270" fill="#36566d" font-family="Arial, sans-serif" font-size="18">Sensor / tombol</text>
    <text x="100" y="297" fill="#36566d" font-family="Arial, sans-serif" font-size="16">Membaca kondisi fisik</text>
    <rect x="465" y="135" width="270" height="200" rx="18" fill="#ffd166"/>
    <rect x="535" y="175" width="130" height="80" rx="10" fill="#102a43"/><path d="M510 190h25M510 220h25M510 250h25M665 190h25M665 220h25M665 250h25" stroke="#102a43" stroke-width="7"/>
    <text x="507" y="290" fill="#102a43" font-family="Arial, sans-serif" font-size="25" font-weight="700">MCU</text>
    <text x="507" y="316" fill="#102a43" font-family="Arial, sans-serif" font-size="16">Program memproses data</text>
    <rect x="840" y="155" width="290" height="160" rx="18" fill="#f7fbff"/>
    <circle cx="895" cy="210" r="27" fill="#1f8a70"/><path d="M880 210h30M895 195v30" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="940" y="210" fill="#102a43" font-family="Arial, sans-serif" font-size="25" font-weight="700">OUTPUT</text>
    <text x="870" y="270" fill="#36566d" font-family="Arial, sans-serif" font-size="18">LED / motor / relay</text>
    <text x="870" y="297" fill="#36566d" font-family="Arial, sans-serif" font-size="16">Menjalankan aksi</text>
  </g>
</svg>
