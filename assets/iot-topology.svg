<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Topologi Internet of Things</title>
  <desc id="desc">Perangkat membaca data, jaringan mengirimkan data, lalu dashboard atau aktuator merespons.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#ffcf5c"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#17324d"/>
  <text x="70" y="70" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">INTERNET OF THINGS</text>
  <text x="70" y="105" fill="#c7d9e8" font-family="Arial, sans-serif" font-size="18">Perangkat terhubung untuk mengirim data dan menerima aksi</text>
  <path d="M360 235H465M735 235H840" stroke="#ffcf5c" stroke-width="7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="70" y="155" width="290" height="160" rx="18" fill="#f7fbff"/>
    <circle cx="125" cy="210" r="27" fill="#168aad"/><path d="M125 193v34M108 210h34" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="170" y="210" fill="#17324d" font-family="Arial, sans-serif" font-size="25" font-weight="700">DEVICE</text>
    <text x="100" y="270" fill="#3d5b70" font-family="Arial, sans-serif" font-size="18">Sensor + ESP32</text>
    <text x="100" y="297" fill="#3d5b70" font-family="Arial, sans-serif" font-size="16">Mengambil data lingkungan</text>
    <rect x="465" y="135" width="270" height="200" rx="18" fill="#ffcf5c"/>
    <path d="M565 245c-18-18-18-42 0-60M635 245c18-18 18-42 0-60M588 227c-8-9-8-20 0-29M612 227c8-9 8-20 0-29" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
    <circle cx="600" cy="260" r="8" fill="#17324d"/>
    <text x="507" y="290" fill="#17324d" font-family="Arial, sans-serif" font-size="25" font-weight="700">NETWORK</text>
    <text x="507" y="316" fill="#17324d" font-family="Arial, sans-serif" font-size="16">Wi-Fi / MQTT / HTTP</text>
    <rect x="840" y="155" width="290" height="160" rx="18" fill="#f7fbff"/>
    <rect x="872" y="188" width="48" height="42" rx="5" fill="#168aad"/><path d="M880 244h32M896 230v14" stroke="#168aad" stroke-width="6" stroke-linecap="round"/>
    <text x="940" y="210" fill="#17324d" font-family="Arial, sans-serif" font-size="25" font-weight="700">ACTION</text>
    <text x="870" y="270" fill="#3d5b70" font-family="Arial, sans-serif" font-size="18">Dashboard / aktuator</text>
    <text x="870" y="297" fill="#3d5b70" font-family="Arial, sans-serif" font-size="16">Menampilkan atau merespons</text>
  </g>
</svg>
